<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub - Create Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8e8e8;
            font-family: Arial, Helvetica, sans-serif;
        }

        .register-container {
            width: 400px;
            max-width: 92%;
            padding: 40px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .logo {
            margin-bottom: 8px;
            color: #36c9bd;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #777;
            font-size: 15px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #222;
            font-size: 28px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-size: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            border-color: #36c9bd;
            outline: none;
            box-shadow: 0 0 0 2px rgba(54, 201, 189, 0.15);
        }

        .password-visibility {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 9px;
            color: #555;
            font-size: 14px;
            font-weight: normal;
        }

        .password-visibility input {
            width: auto;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 6px;
            background: #36c9bd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #27afa5;
        }

        .submit-btn:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .message {
            display: none;
            margin-top: 15px;
            color: #d93025;
            font-size: 14px;
            text-align: center;
        }

        .login-link {
            margin-top: 24px;
            color: #666;
            font-size: 15px;
            text-align: center;
        }

        .login-link a {
            color: #1976a8;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .register-container {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <main class="register-container">
        <div class="logo">Learn</div>
        <p class="subtitle">Learn. Practice. Build.</p>
        <h1>Create Account</h1>

        <form id="registerForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    maxlength="254"
                    required
                >
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    placeholder="At least 12 characters"
                    minlength="12"
                    maxlength="1024"
                    required
                >
                <label class="password-visibility" for="showPassword">
                    <input type="checkbox" id="showPassword">
                    Show password
                </label>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    placeholder="Enter your password again"
                    minlength="12"
                    maxlength="1024"
                    required
                >
            </div>
            <button class="submit-btn" type="submit">Create Account</button>
            <div class="message" id="message" role="alert" aria-live="polite"></div>
        </form>

        <p class="login-link">Already have an account? <a href="/">Log in</a></p>
    </main>

    <script>
        document
            .getElementById("showPassword")
            .addEventListener("change", function() {
                const inputType = this.checked ? "text" : "password";
                document.getElementById("password").type = inputType;
                document.getElementById("confirmPassword").type = inputType;
            });

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const message = document.getElementById("message");
                const button = document.querySelector(".submit-btn");
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                message.style.display = "none";

                if (password !== confirmPassword) {
                    message.textContent = "The passwords do not match.";
                    message.style.display = "block";
                    return;
                }

                button.disabled = true;
                try {
                    const response = await fetch("/api/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            email: document.getElementById("email").value.trim(),
                            password
                        })
                    });
                    const result = await response.json();

                    if (!response.ok) {
                        message.textContent = result.error || "Could not create your account.";
                        message.style.display = "block";
                        return;
                    }

                    window.location.href = "/home.html";
                } catch {
                    message.textContent = "Could not connect to the server. Please try again.";
                    message.style.display = "block";
                } finally {
                    button.disabled = false;
                }
            });
    </script>
</body>
</html>
